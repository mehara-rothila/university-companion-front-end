[build]
  command = "npm run build"
  publish = ".next"

# Make environment variables available during build
[build.environment]
  NODE_VERSION = "18"
  # Backend API is hosted on Heroku
  NEXT_PUBLIC_API_URL = "https://athena001-535225bb557e.herokuapp.com"
  NEXT_PUBLIC_WS_URL = "wss://athena001-535225bb557e.herokuapp.com/ws"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Redirect rules for Next.js app
# Note: @netlify/plugin-nextjs handles Next.js routing automatically
# Do NOT add a catch-all SPA redirect here — it breaks SSR and API routes

# Headers for security
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
