[build]
  command = "npm run build"
  publish = ".next"

# Make environment variables available during build
[build.environment]
  NODE_VERSION = "18"
  # Backend API is hosted on Heroku
  NEXT_PUBLIC_API_URL = "https://l3project-398c7c93d2bb.herokuapp.com"
  NEXT_PUBLIC_WS_URL = "https://l3project-398c7c93d2bb.herokuapp.com/ws"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Redirect rules for Next.js app
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers for security
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
