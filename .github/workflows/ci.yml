name: Frontend CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# The job only reads the code, so the token gets no write access.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        # Don't leave the token in .git/config where npm scripts could read it.
        persist-credentials: false

    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: npm

    - name: Install Dependencies
      run: npm ci

    - name: Type Check
      run: npm run typecheck

    - name: Run Tests
      run: npm test -- --ci

    - name: Build
      run: npm run build
      env:
        NEXT_TELEMETRY_DISABLED: 1
